<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#4b98bf"/>
  <!-- Gear: dashed stroke makes 12 teeth -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#fff" stroke-width="7" stroke-dasharray="5 4.95"/>
  <circle cx="32" cy="32" r="16" fill="#fff"/>
  <!-- Wheel with spokes -->
  <circle cx="32" cy="32" r="11" fill="#0f1a22"/>
  <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="23" x2="32" y2="41"/>
    <line x1="23" y1="32" x2="41" y2="32"/>
    <line x1="25.6" y1="25.6" x2="38.4" y2="38.4"/>
    <line x1="38.4" y1="25.6" x2="25.6" y2="38.4"/>
  </g>
  <circle cx="32" cy="32" r="4" fill="#ff7723"/>
</svg>
